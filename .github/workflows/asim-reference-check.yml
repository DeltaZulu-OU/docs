name: ASIM reference snapshot verification
on:
  push:
    branches: [master]
    paths:
      - 'tools/asim/**'
      - 'architecture/ASIM-GOLD-TARGET-FIELDS.csv'
      - '.github/workflows/asim-reference-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet PyYAML==6.0.3 markdown-it-py==4.2.0
      - run: python3 -m unittest discover -s tools/asim/tests -v
      - name: Explicit acquisition of pinned public reference files
        run: python3 tools/asim/fetch.py
      - name: Extract offline
        run: python3 tools/asim/extract.py
      - name: Verify deterministic regeneration
        run: |
          cp tools/asim/generated/reference-catalogue.json /tmp/asim-first.json
          python3 tools/asim/extract.py
          cmp /tmp/asim-first.json tools/asim/generated/reference-catalogue.json
      - name: Upload reference metadata, not raw upstream files
        uses: actions/upload-artifact@v4
        with:
          name: asim-reference-catalogue
          path: tools/asim/generated/reference-catalogue.json
          retention-days: 7
